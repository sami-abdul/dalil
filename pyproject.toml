[project]
name = "dalil"
version = "0.1.0"
description = "Answers about UAE government services, tied sentence by sentence to the official text, with a person approving each answer."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "fonttools>=4.67.0",
    "lxml>=6.1.3",
    "pypdf>=6.21.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
